[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbot"
version = "0.1.0"
description = "Local Gmail cleanup CLI with LLM-assisted classification and strict trash safety rules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.180.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "openai>=1.55.0",
    "pydantic>=2.7.0,<3",
    "python-dotenv>=1.1.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[project.scripts]
mailbot = "mailbot.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
